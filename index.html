<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>For My Love 💕</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="background-gradient"></div>
    <div class="floating-hearts"></div>

    <main class="container">
      <section class="card">
        <div class="header">
          <span class="tag">For you, with all my heart</span>
          <h1>
            Hey
            <span class="name" id="her-name">Uzma </span>,
          </h1>
        </div>

        <p class="subtitle">
          Every heartbeat, every smile, every moment feels better with you in it.
        </p>

        <div class="letter" id="letter">
          <span class="caret"></span>
        </div>

        <div class="question-block">
          <p class="question-text">Will you always be mine?</p>
          <div class="answer-buttons">
            <button class="answer-btn yes" id="yes-btn">Yes</button>
            <button class="answer-btn no" id="no-btn">No</button>
          </div>
        </div>

        <button class="btn" id="reveal-btn">
          Tap to feel how much I love you
        </button>

        <div class="bottom-message" id="bottom-message">
          <div class="glow-heart">❤</div>
          <p>
            I just hope this little page makes you smile, even for a moment. 💌
          </p>
        </div>
      </section>
    </main>

    <canvas id="love-canvas"></canvas>

    <script src="script.js"></script>
  </body>
</html>
